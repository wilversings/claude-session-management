name: Publish to npm

# Fires on version tags (v1.2.3). Dormant for now: the `publish` job below is
# gated behind `if: false`. To activate, delete (or flip to `true`) that
# line — see AGENTS.md "Publishing" for the full checklist, including
# setting the NPM_TOKEN repo secret.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
