name: Publish to npm

# Manual trigger only — run from the Actions tab (or `gh workflow run`) to
# publish to npm. Requires the NPM_TOKEN repo secret (an npm automation
# token with publish rights) to be set — see AGENTS.md "Publishing".
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
